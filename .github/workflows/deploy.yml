name: Deploy to Production

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          timeout: 300000
          script: |
            set -e
            DEPLOY_DIR="/home/${{ secrets.SERVER_USER }}/ele_admin"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Ensure docker-compose.yml exists (first deploy)
            if [ ! -f "docker-compose.yml" ]; then
              if command -v git &>/dev/null; then
                git clone --depth 1 https://github.com/${{ github.repository }}.git /tmp/ele_admin_repo
                cp /tmp/ele_admin_repo/docker-compose.yml .
                cp -r /tmp/ele_admin_repo/backup .
                cp /tmp/ele_admin_repo/deploy/*.sh . 2>/dev/null || true
                rm -rf /tmp/ele_admin_repo
              fi
            fi

            # create .env on first deploy
            if [ ! -f ".env" ]; then
              JWT_SECRET=$(openssl rand -hex 32)
              cat > .env << 'ENVEOF'
JWT_SECRET=
JWT_EXPIRES_IN=7d
CORS_ORIGIN=*
LOG_RETENTION_DAYS=30
RESPONSE_TIME_ZONE=Asia/Shanghai
UPLOAD_MAX_SIZE=10485760
ENVEOF
              sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${JWT_SECRET}|" .env
              echo "✅ 已生成 .env 文件（JWT_SECRET 已自動生成）"
            fi

            # pull latest image
            echo "📥 拉取最新應用鏡像..."
            docker compose pull app

            # ensure MongoDB is running
            echo "🐳 啟動 MongoDB..."
            docker compose up -d mongodb

            # wait for MongoDB
            echo "⏳ 等待 MongoDB 就緒..."
            for i in $(seq 1 30); do
              if docker compose exec -T mongodb mongosh --quiet --eval "db.adminCommand('ping').ok" 2>/dev/null | grep -q 1; then
                echo "✅ MongoDB 已就緒"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "⚠️  MongoDB 未在預期時間內就緒，繼續部署..."
              fi
              sleep 2
            done

            # start application
            echo "🚀 啟動應用服務..."
            docker compose up -d --remove-orphans

            # health check
            echo "🏥 執行健康檢查..."
            sleep 5
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ 應用已正常啟動"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "⚠️  健康檢查未通過，請手動檢查日誌"
                docker compose logs --tail=20 app
              fi
              sleep 5
            done

            # clean up old images
            docker image prune -f

            echo ""
            echo "============================================"
            echo "✅ 部署完成！"
            echo "============================================"
            docker compose ps