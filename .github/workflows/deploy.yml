name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN || '*' }}
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: JWT_SECRET,CORS_ORIGIN
          script: |
            set -e
            
            APP_DIR="/opt/ele_admin"
            REPO_DIR="$APP_DIR/repo"
            
            echo "===== 开始部署 ====="
            
            sudo mkdir -p $APP_DIR
            sudo chown -R ubuntu:ubuntu $APP_DIR
            
            if [ -d "$REPO_DIR/.git" ]; then
              cd $REPO_DIR
              git pull origin main
            else
              git clone https://github.com/JERSONLEIBOY/express-mongodb-backend-api.git $REPO_DIR
              cd $REPO_DIR
            fi
            
            npm install --production
            
            cat > .env << EOF
NODE_ENV=production
PORT=3000
MONGODB_URI=mongodb://localhost:27017/ele_admin
JWT_SECRET=$JWT_SECRET
JWT_EXPIRES_IN=7d
CORS_ORIGIN=$CORS_ORIGIN
LOG_RETENTION_DAYS=30
RESPONSE_TIME_ZONE=Asia/Shanghai
UPLOAD_PATH=./src/uploads
UPLOAD_MAX_SIZE=10485760
EOF
            
            docker-compose down 2>/dev/null || true
            
            cat > docker-compose.yml << EOF
version: '3.8'
services:
  mongodb:
    image: mongo:7
    container_name: ele_admin_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
volumes:
  mongodb_data:
EOF
            
            docker-compose up -d
            
            sleep 10
            
            pkill -f "node src/app.js" 2>/dev/null || true
            
            nohup node src/app.js > /var/log/ele_admin.log 2>&1 &
            
            sleep 10
            
            if curl -sf http://localhost:3000/health > /dev/null; then
              echo "✅ 部署成功"
            else
              echo "❌ 部署失败"
              exit 1
            fi
            
            echo "===== 部署完成 ====="