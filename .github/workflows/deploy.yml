name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            APP_DIR="/opt/ele_admin"
            REPO_DIR="/tmp/express-mongodb-backend-api"
            
            echo "===== 开始部署 ====="
            
            sudo mkdir -p $APP_DIR
            sudo chown -R ubuntu:ubuntu $APP_DIR
            
            if [ -d "$REPO_DIR/.git" ]; then
              echo "更新代码..."
              cd $REPO_DIR
              git pull origin main
            else
              echo "克隆代码..."
              rm -rf $REPO_DIR
              git clone https://github.com/JERSONLEIBOY/express-mongodb-backend-api.git $REPO_DIR
              cd $REPO_DIR
            fi
            
            echo "构建 Docker 镜像..."
            IMAGE_TAG=$(git rev-parse HEAD)
            docker build -f docker/Dockerfile -t ele_admin_backend:$IMAGE_TAG .
            docker tag ele_admin_backend:$IMAGE_TAG ele_admin_backend:latest
            
            cd $APP_DIR
            cat > docker-compose.yml << 'COMPOSE_EOF'
version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ele_admin_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ele_admin
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  app:
    image: ele_admin_backend:latest
    container_name: ele_admin_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/ele_admin
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: ${{ secrets.CORS_ORIGIN || '*' }}
      LOG_RETENTION_DAYS: 30
      RESPONSE_TIME_ZONE: Asia/Shanghai
      UPLOAD_PATH: ./src/uploads
      UPLOAD_MAX_SIZE: 10485760
    volumes:
      - app_uploads:/app/src/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
  app_uploads:
COMPOSE_EOF
            
            echo "停止旧容器..."
            docker-compose down --remove-orphans 2>/dev/null || true
            
            echo "启动服务..."
            docker-compose up -d
            
            echo "等待服务启动..."
            sleep 15
            
            echo "容器状态:"
            docker-compose ps
            
            echo "检查应用健康..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health > /dev/null; then
                echo "✅ 应用健康检查通过"
                break
              fi
              echo "等待中... (${i}/30)"
              sleep 2
            done
            
            echo "===== 部署完成 ====="