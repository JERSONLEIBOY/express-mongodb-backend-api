name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_DIR: /opt/ele_admin

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract image SHA
        id: image
        shell: bash
        run: |
          echo "sha=$(echo '${{ steps.meta.outputs.tags }}' | grep -oP 'sha-\K[0-9a-f]{7}')" >> $GITHUB_OUTPUT
          echo "full=$(echo '${{ steps.meta.outputs.tags }}' | grep -oP 'sha-[0-9a-f]{40}')" >> $GITHUB_OUTPUT

      - name: Upload deployment info
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: |
            deployment_info.txt
          retention-days: 1

      - name: Save deployment info
        shell: bash
        run: |
          cat > deployment_info.txt << EOF
          IMAGE_TAG=sha-${{ env.GITHUB_SHA }}
          IMAGE_FULL=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.GITHUB_SHA }}
          PREVIOUS_SHA=$(git rev-parse HEAD^1 2>/dev/null || echo "")
          EOF

      - name: Set outputs
        id: deploy-info
        shell: bash
        run: |
          echo "image_sha=sha-${{ env.GITHUB_SHA }}" >> $GITHUB_OUTPUT
          echo "image_full=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ env.GITHUB_SHA }}" >> $GITHUB_OUTPUT

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs:
            APP_DIR,IMAGE_TAG,IMAGE_FULL
          script: |
            set -e

            cd $APP_DIR

            echo "=========================================="
            echo "  开始部署"
            echo "=========================================="
            echo "镜像: $IMAGE_FULL"

            # 记录当前版本（用于回滚）
            if [ -f .versions ]; then
              CURRENT=$(head -n1 .versions | awk '{print $1}')
              echo "当前版本: $CURRENT"
            fi

            # 停止旧服务
            echo ""
            echo "停止旧服务..."
            docker compose down || true

            # 拉取新镜像
            echo ""
            echo "拉取新镜像..."
            docker compose pull

            # 更新版本记录
            echo ""
            echo "$IMAGE_TAG $(date +%Y-%m-%d_%H:%M:%S)" > .versions

            # 启动服务
            echo ""
            echo "启动服务..."
            IMAGE_TAG=$IMAGE_TAG docker compose up -d

            # 健康检查
            echo ""
            echo "健康检查..."
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ 部署成功，服务健康"
                exit 0
              fi
              echo "等待服务启动... (${i}/12)"
              sleep 5
            done

            echo ""
            echo "❌ 健康检查失败，查看日志:"
            docker compose logs --tail=50
            exit 1

  rollback:
    needs: build
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs:
            APP_DIR
          script: |
            cd $APP_DIR
            echo "检测到部署失败，执行回滚..."
            docker compose down
            docker compose up -d
