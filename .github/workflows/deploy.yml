name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: ".,!.git,!node_modules,!backup,!logs"
          target: /opt/ele_admin/repo

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: JWT_SECRET,CORS_ORIGIN,MONGO_USERNAME,MONGO_PASSWORD
          script: |
            set -e
            cd /opt/ele_admin/repo

            printf 'JWT_SECRET=%s\nCORS_ORIGIN=%s\nMONGO_USERNAME=%s\nMONGO_PASSWORD=%s\n' \
              "$JWT_SECRET" "$CORS_ORIGIN" "$MONGO_USERNAME" "$MONGO_PASSWORD" > .env

            docker build -t ele_admin_backend:latest -f docker/Dockerfile .

            docker-compose down --remove-orphans 2>/dev/null || true
            docker rm -f ele_admin_mongodb ele_admin_backend 2>/dev/null || true
            docker-compose up -d

            echo "等待服务启动..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ 部署成功"
                exit 0
              fi
              echo "等待中... ($i/30)"
              sleep 2
            done

            echo "❌ 服务健康检查未通过"
            docker-compose logs app
            exit 1
