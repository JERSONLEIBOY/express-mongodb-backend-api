name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 2222 }}
          envs: JWT_SECRET,CORS_ORIGIN,MONGO_USERNAME,MONGO_PASSWORD
          script: |
            set -e

            APP_DIR="/opt/ele_admin"
            REPO_DIR="$APP_DIR/repo"
            IMAGE_TAG="latest"

            echo "===== 开始部署 ====="

            sudo mkdir -p $APP_DIR
            sudo chown -R $USER:$USER $APP_DIR

            if [ -d "$REPO_DIR/.git" ]; then
              cd $REPO_DIR
              git pull origin main
            else
              git clone https://github.com/JERSONLEIBOY/express-mongodb-backend-api.git $REPO_DIR
              cd $REPO_DIR
            fi

            cp docker/Dockerfile .

            cd $REPO_DIR
            docker build -t ghcr.io/jersonleiboy/express-mongodb-backend-api:$IMAGE_TAG -f Dockerfile .

            printf 'JWT_SECRET=%s\nCORS_ORIGIN=%s\nMONGO_USERNAME=%s\nMONGO_PASSWORD=%s\n' "$JWT_SECRET" "$CORS_ORIGIN" "$MONGO_USERNAME" "$MONGO_PASSWORD" > .env

            docker-compose down --remove-orphans 2>/dev/null || true
            docker rm -f ele_admin_mongodb ele_admin_backend 2>/dev/null || true

            IMAGE_TAG=$IMAGE_TAG docker-compose up -d

            echo "等待服务启动..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ 部署成功 - 服务已就绪"
                exit 0
              fi
              echo "等待中... ($i/30)"
              sleep 2
            done

            echo "❌ 部署失败 - 服务健康检查未通过"
            docker-compose logs app
            exit 1
