services:
  mongodb:
    image: mongo:6
    container_name: ele_admin_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ele_admin
    volumes:
      - mongodb_data:/data/db
      - ./backup:/backup
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-username/express-mongodb-backend-api}:latest
    container_name: ele_admin_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/ele_admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      RESPONSE_TIME_ZONE: ${RESPONSE_TIME_ZONE:-Asia/Shanghai}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-10485760}
    volumes:
      - app_uploads:/app/uploads
      - app_logs:/app/logs
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
    driver: local
  app_uploads:
    driver: local
  app_logs:
    driver: local
